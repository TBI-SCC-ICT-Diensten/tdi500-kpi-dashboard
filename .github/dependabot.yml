# Dependabot configuration — opens automated dependency-update PRs.
# Dependabot reads this from the repository's DEFAULT branch (main).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # JavaScript / TypeScript dependencies (root package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    # Open version-update PRs against develop (not the default branch main),
    # so routine dependency bumps follow the develop -> main release flow.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Bundle all minor + patch bumps into ONE weekly PR to keep review
      # noise low. Major bumps still arrive as separate PRs so potential
      # breaking changes stay visible.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Suppress ROUTINE major-version bumps of the core stack — we do these as
    # deliberate, separate migrations (one library at a time), not weekly bulk.
    # Security updates are NOT affected by version-update ignores, so real
    # vulnerability PRs still surface.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is a deliberate, separate migration (CSS-first config, no
      # corePlugins.preflight; shadcn/ui 2.3.0 is pinned on v3) — not a routine
      # bump. See closed PR #182.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # tailwind-merge v3 targets Tailwind v4 class semantics; on Tailwind v3
      # twMerge/cn() would resolve classes wrong. Stays v2 until the Tailwind
      # v4 migration. See closed PR #183.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]

  # Azure Functions backend (azure-api/package.json + package-lock.json) — the
  # BYOF production API. Separate entry so its build/runtime deps (esbuild,
  # typescript, vitest, @azure/functions, @types/node) get routine version-update
  # PRs, also targeted at develop so they follow the develop -> main release flow.
  # NOTE: target-branch governs VERSION updates only. Dependabot SECURITY updates
  # always open against the DEFAULT branch (main) regardless of this setting — that
  # is why the esbuild security bump #154 landed on main, not develop.
  - package-ecosystem: "npm"
    directory: "/azure-api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Same low-noise grouping as the root entry: minor + patch bundled,
      # majors arrive separately so breaking changes stay visible.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # @types/node must track the Node 20 runtime (engines >=20, workflow
    # NODE_VERSION 20, host bundle [4.*,5.0.0)). Block MAJOR bumps (Node 21+
    # types type-check against APIs absent at the Node 20 runtime and would
    # crash — see closed PR #160). Minor/patch within 20.x still flow.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # When a CI workflow is added (see verbetervoorstel VV-27), enable
  # GitHub Actions updates too by uncommenting the block below:
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
